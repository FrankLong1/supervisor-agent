[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-unread-task-supervisor"
version = "0.1.0"
description = "Fail-closed local supervisor for unread Codex tasks"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
codex-unread-supervisor = "codex_supervisor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_supervisor = ["supervisor_prompt.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
